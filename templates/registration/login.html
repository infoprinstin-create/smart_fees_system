<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Smart Fee</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #0f172a,
                #1d4ed8
            );
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.25);
        }

        .login-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #2563eb;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .login-title {
            text-align: center;
            margin: 0;
            color: #0f172a;
            font-size: 28px;
            font-weight: 800;
        }

        .login-subtitle {
            text-align: center;
            margin: 8px 0 30px;
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .input-wrapper input {
            width: 100%;
            height: 50px;
            padding: 0 15px 0 45px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        .input-wrapper input:focus {
            border-color: #2563eb;
            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .login-button {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .error-message {
            background: #fee2e2;
            color: #b91c1c;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 30px 22px;
            }

            .login-title {
                font-size: 24px;
            }

        }

    </style>

</head>

<body>

    <div class="login-card">

        <div class="login-icon">
            <i class="fas fa-school"></i>
        </div>

        <h1 class="login-title">
            Smart Fee
        </h1>

        <p class="login-subtitle">
            School Fee Management System
        </p>


        {% if form.errors %}

            <div class="error-message">
                <i class="fas fa-circle-exclamation"></i>
                Invalid username or password.
            </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}

            <div class="form-group">

                <label for="id_username">
                    Username
                </label>

                <div class="input-wrapper">

                    <i class="fas fa-user"></i>

                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="id_password">
                    Password
                </label>

                <div class="input-wrapper">

                    <i class="fas fa-lock"></i>

                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="login-button"
            >

                <i class="fas fa-right-to-bracket"></i>

                Login

            </button>

        </form>

    </div>

</body>

</html>
